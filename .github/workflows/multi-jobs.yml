name: Multi jobs

on:
  push:

env:
  TEST: Default

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Set env
        run: echo "TEST=First" >> $GITHUB_ENV
      - name: Print env
        run: echo "${{ env.TEST }}"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job

    steps:
      - name: Print env
        run: echo "${{ env.TEST }}"
